# .github/workflows/plan.yml -- runs on every pull request.
#
# It answers two questions BEFORE anything is changed:
#   1. lint:  is the code well-formed?                 (no credentials needed)
#   2. plan:  what WOULD Terraform change, per folder?  (posted as a PR comment)
# A reviewer reads the plan comment instead of trusting the diff alone.
name: Terraform Plan

# No `paths:` filter on the trigger, on purpose. If a workflow does not start at all,
# a REQUIRED status check (branch protection) would wait forever. Instead the workflow
# always starts, and the `detect-changes` job below decides which folders to plan;
# the plan job is simply skipped when nothing relevant changed (a skipped job counts
# as passed).
on:
  pull_request:

# Least privilege: every job gets read-only access to the repo unless it asks for more.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- 1. LINT
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          # Keep identical to .github/actions/terraform-setup/action.yml.
          terraform_version: "1.15.6"
          terraform_wrapper: false

      # Fails if any file is not formatted the canonical way. Fix locally with:
      #   terraform fmt -recursive
      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      # `init -backend=false` downloads providers but does NOT touch the remote state,
      # so no secrets are needed. `validate` then checks syntax and references.
      - name: Validate every root
        run: |
          set -e
          for dir in network storage vm-*/; do
            echo "::group::validate $dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

  # ------------------------------------------------- 2. WHICH FOLDERS CHANGED?
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter lists the files changed by the pull request
    outputs:
      dirs: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Each key is a folder to plan. The patterns say what makes that folder
          # "changed": its own files, the module it uses, or a shared file.
          # ORDER MATTERS: the output keeps this order, and apply.yml relies on it
          # (network -> storage -> VMs). Keep the two files' filters identical.
          filters: |
            network:
              - 'network/**'
              - 'modules/network-identity/**'
              - 'backend.hcl'
            storage:
              - 'storage/**'
              - 'backend.hcl'
            vm-a:
              - 'vm-a/**'
              - 'modules/vm/**'
              - 'users.yaml'
              - 'backend.hcl'
            vm-b:
              - 'vm-b/**'
              - 'modules/vm/**'
              - 'users.yaml'
              - 'backend.hcl'
            vm-c:
              - 'vm-c/**'
              - 'modules/vm/**'
              - 'users.yaml'
              - 'backend.hcl'

  # ------------------------------------------------------------------ 3. PLAN
  plan:
    needs: detect-changes
    # Skip when nothing relevant changed ('[]' is an empty JSON list).
    if: needs.detect-changes.outputs.dirs != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # needed to post the comment
    strategy:
      # One job per changed folder. Keep going if one fails, so the reviewer sees
      # every problem at once instead of one per push.
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.detect-changes.outputs.dirs) }}
    # Job-level env reaches EVERY step, including the ones inside the composite action.
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: ./.github/actions/terraform-setup
        with:
          directory: ${{ matrix.dir }}
          clouds-yaml: ${{ secrets.OS_CLOUDS_YAML }}
          bucket-name: ${{ secrets.BUCKET_NAME }}

      # `shell: bash` makes GitHub run bash with `pipefail`, so if terraform fails the
      # step fails even though its output goes through `tee`.
      # -lock=false: a PLAN only reads; it should not block a teammate's apply.
      - name: Terraform plan
        id: plan
        shell: bash
        working-directory: ${{ matrix.dir }}
        run: terraform plan -no-color -input=false -lock=false | tee plan_output.txt

      # Post (or update) ONE comment per folder. Runs even if the plan failed, so the
      # error is visible in the pull request.
      - name: Comment the plan on the pull request
        if: ${{ !cancelled() }}
        uses: actions/github-script@v7
        env:
          PLAN_DIR: ${{ matrix.dir }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            const dir = process.env.PLAN_DIR;
            const marker = `<!-- terraform-plan:${dir} -->`;
            const file = `${dir}/plan_output.txt`;

            let output = fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : '(no plan output: see the workflow log)';
            // GitHub rejects comments over 65,536 characters. Keep the END of the
            // plan, because the summary line and errors are at the bottom.
            const LIMIT = 60000;
            if (output.length > LIMIT) {
              output = '... (truncated, see the workflow log) ...\n' + output.slice(-LIMIT);
            }

            const status = process.env.PLAN_OUTCOME === 'success' ? '' : ' - FAILED';
            const body = `${marker}\n### Terraform plan: \`${dir}\`${status}\n<details><summary>Show plan</summary>\n\n\`\`\`\n${output}\n\`\`\`\n</details>`;

            // Update our previous comment for this folder instead of adding a new one per push.
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
